<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>SPRAY N' SKATE — jogo de skate (melonJS)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a14; overflow: hidden; font-family: Arial, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #screen { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
      canvas { image-rendering: auto; outline: none; box-shadow: 0 0 40px rgba(76, 201, 240, 0.25); }
      #touch { display: none; width: 100%; padding: 8px 8px 14px; box-sizing: border-box; gap: 8px; justify-content: center; }
      #touch button {
        flex: 1; max-width: 120px; height: 64px; border: 0; border-radius: 12px; font-weight: 700; font-size: 15px;
        color: #fff; background: #2b2f55; touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #touch button.on { background: #ffb703; color: #10101c; }
      @media (pointer: coarse) { #touch { display: flex; } }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <div id="touch">
      <button data-key="SPACE">OLLIE</button>
      <button data-key="Z">KICKFLIP</button>
      <button data-key="X">SHOVE-IT</button>
      <button data-key="C">GRAB</button>
      <button data-key="DOWN">GRIND ↓</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
